[package]
name = "claude-account-manager"
version = "0.2.2"
license = "MIT"
description = "Local Claude Code subscription account switcher"
edition = "2021"
rust-version = "1.90"
default-run = "claude-account-manager"

[[bin]]
name = "cam-launcher"
path = "src/launcher.rs"

[lib]
name = "claude_account_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
fs2 = "0.4"
tempfile = "3"
wait-timeout = "0.2"
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rfd = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
aes-gcm = { version = "0.10", features = ["zeroize"] }
rfd = { version = "0.16", default-features = false }

[dev-dependencies.aes-gcm]
version = "0.10"
features = ["zeroize"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Explicit offline integration build. It refuses to start outside a marked
# synthetic HOME, and is never enabled by normal build/install scripts.
synthetic-tests = []
